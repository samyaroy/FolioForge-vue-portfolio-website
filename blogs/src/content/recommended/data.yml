# Writing by OTHER PEOPLE, recommended here. Loaded through data.ts, which
# keeps this file's order: the first eight entries ride the carousel on the
# blog home page, and /recommended shows every entry, shelved by category in
# the order the categories are listed below. Reorder here to change both.
# Every card links straight to the original; nothing of the piece itself is
# reproduced on this site.
#
# Category fields:
#   id:     unique slug; an entry's `category` names one of these
#   label:  the shelf heading and filter chip
#   blurb:  optional, one line under the shelf heading; shown only while
#           the showRecommendedCategoryBlurbs feature flag is on
#   icon:   optional, a Material Design Icons class, e.g. mdi-brain
#
# Entry fields:
#   id:        unique slug, used as the React key
#   title:     the piece's own title, as its author or publisher wrote it
#   author:    who wrote it — always shown, so nobody mistakes it for yours
#   source:    the domain it lives on
#   publisher: optional, the publication's name ("Aeon"); shown in place of
#              `source` on the card
#   category:  the id of one of the categories above; entries without one
#              land on a final "More" shelf
#   url:       the full external URL
#   year:      optional, the year it was published; read from `published`
#              when that is set
#   published: optional, the original's publication date, as "YYYY-MM-DD"
#   subtitle:  optional, a one-line hook shown on the card
#   note:      optional, one or two sentences in your own voice on why it is
#              here. Shown after a ✳ on cards without a subtitle.
#   readingMinutes: optional, time to read the original at ~200 words/min
#   level:     optional, how demanding it is ("Intermediate"); full page only
#
# NOTE: the six entries from "unreasonable-effectiveness-rnn" down are
# placeholders — real, well-known posts put here so the page renders with
# something in it. Check every `url` and rewrite every `note` in your own
# words before publishing. The five above them were checked against their
# publishers on 2026-10-24.

categories:
  - id: society
    label: Society & Culture
    blurb: How people live together — belonging, exclusion, and the stories societies tell about who counts.
    icon: mdi-account-group-outline

  - id: mind
    label: Mind & Brain
    blurb: How a brain builds a world out of guesses, and a map of the people in it.
    icon: mdi-brain

  - id: complexity
    label: Mathematics & Complexity
    blurb: What it means to understand something — proofs, intuition, and wholes that outrun their parts.
    icon: mdi-graph-outline

  - id: machine-learning
    label: Machine Learning
    blurb: The ideas behind modern models, explained by the people who worked them out.
    icon: mdi-robot-outline

  - id: craft
    label: Work & Craft
    blurb: On choosing problems, and on doing the work well.
    icon: mdi-pencil-ruler

items:
  - id: the-future-of-loneliness
    title: The future of loneliness
    author: Olivia Laing
    source: theguardian.com
    publisher: The Guardian
    category: society
    published: "2015-04-01"
    url: https://www.theguardian.com/society/2015/apr/01/future-of-loneliness-internet-isolation
    readingMinutes: 19
    level: Accessible–Intermediate
    subtitle: We have never been more connected. Why, then, does loneliness remain so difficult to escape?

  - id: the-mathematics-of-mind-time
    title: The mathematics of mind-time
    author: Karl Friston
    source: aeon.co
    publisher: Aeon
    category: mind
    published: "2017-05-18"
    url: https://aeon.co/essays/consciousness-is-not-a-thing-but-a-process-of-inference
    readingMinutes: 19
    level: Advanced
    subtitle: What if consciousness is not something we possess, but a continuous process of predicting what comes next?

  - id: reality-more-than-sum-of-parts
    title: A Theory of Reality as More Than the Sum of Its Parts
    author: Natalie Wolchover
    source: quantamagazine.org
    publisher: Quanta Magazine
    category: complexity
    published: "2017-06-01"
    url: https://www.quantamagazine.org/a-theory-of-reality-as-more-than-the-sum-of-its-parts-20170601/
    readingMinutes: 15
    level: Intermediate–Advanced
    subtitle: If we understand every individual component of a system, have we necessarily understood the system itself?

  - id: monstrification
    title: Monstrification
    author: Surekha Davies
    source: aeon.co
    publisher: Aeon
    category: society
    published: "2025-10-24"
    url: https://aeon.co/essays/those-declared-monsters-are-ejected-from-the-human-family
    readingMinutes: 18
    level: Intermediate
    subtitle: What if monsters are not simply discovered, but created by the societies that define them?

  - id: the-geometry-of-other-people
    title: The geometry of other people
    author: David Borkenhagen
    source: aeon.co
    publisher: Aeon
    category: mind
    published: "2024-01-11"
    url: https://aeon.co/essays/why-do-other-people-form-imaginary-shapes-in-our-minds
    readingMinutes: 19
    level: Intermediate
