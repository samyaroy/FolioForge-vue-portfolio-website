# Movies shown on the Movies page. Loaded through data.ts, which applies the
# types and sorts newest-first (by `date`), so order here doesn't matter.
# Keep dates quoted so they stay strings ("YYYY-MM-DD").
#
# Required per item: id, title, director, genre, description
#
# Optional per-item fields:
#   year:   release year, shown in the card/modal meta line
#   date:   when you watched it, as "YYYY-MM-DD"
#   image:  poster picture; a full URL, or a bare CDN key resolved to
#           https://media.samyabrata.codeium.xyz/<key>.jpeg (same as gallery).
#           When absent, the clapperboard illustration renders instead.
#   note:   longer personal take; use a block scalar (note: |) and blank
#           lines to split paragraphs. Falls back to `description` if absent.
#   rating: 1-5 stars
#   link:   external page about the film (Wikipedia, IMDb, Letterboxd, ...)

items:
  - id: the-cabinet-of-dr-caligari
    title: The Cabinet of Dr. Caligari
    director: Robert Wiene
    genre: German Expressionist horror
    year: 1920
    description: "A landmark of silent cinema, with distorted sets and stark shadows turning a mystery about a hypnotist and a sleepwalker into a fever dream."
    link: https://youtu.be/zV00ylxcwXw?si=PYNzSWAipulmEI-6
