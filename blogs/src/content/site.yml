# Site-wide identity, hero, social links, and footer copy.
# Loaded through src/content/site.ts, which applies the types.

profile:
  name: Samyabrata Roy
  profileIconPath: /profile-icon.png
  email: samyaroy00@gmail.com

# Full-bleed hero shown at the top of the blog home page.
# Drop your own image at blogs/public/hero.jpg (any wide image works).
# If that file is missing, the fallback below renders so the page is never empty.
hero:
  imagePath: /hero.jpg
  fallbackImage: https://picsum.photos/1600/900?grayscale
  alt: Featured artwork
  caption: Generated using Gemini 3.1 Pro

# "What's new" panel beside the hero (flag: showHomeLatest): the newest post
# as a featured card, then a row each for the newest reading and movie. A row
# hides when its section is switched off or has nothing in it.
homeLatest:
  # Small uppercase heading above the panel.
  title: What's new around here
  post: New post
  readPost: Read post
  reading: Reading
  movie: Watched
  # Heading over the post list below the hero while the newest post is
  # featured up top; {title} becomes a link to that post.
  olderTitle: Older posts
  olderNote: "The newest, {title}, is featured up top."

# Social links rendered vertically on the right edge of the hero.
# Edit the hrefs to point at your own profiles; remove any you don't use.
socialLinks:
  - label: X
    href: https://x.com/
  - label: Instagram
    href: https://www.instagram.com/the_pessimist_one/
  - label: LinkedIn
    href: https://www.linkedin.com/in/samyabrata23/

footer:
  privacyLabel: Privacy Policy
  privacyPath: /privacy-policy
  rightsText: Rights Reserved
  lastUpdatedLabel: Last updated
  lastUpdated: October 2026
  iconAttributionIntro: "ⓘ Some icons used are made by"
  iconAttributionSource: from
  iconAttributionLinks:
    - label: Freepik
      href: https://www.flaticon.com/authors/freepik
    - label: Smashicons
      href: https://www.flaticon.com/authors/smashicons
    - label: Flaticon
      href: https://www.flaticon.com/free-icons/class
  designCreditIntro: "ⓘ Some UI designs are inspired from"
  designCreditName: Asib uz zaman Nahid
  designCreditHref: https://dribbble.com/asibuzzaman
  designCreditOutro: "'s work"
  # Disclosure under the credits, covering /recommended and the movie
  # creator shoutouts.
  disclosure: "ⓘ No recommendation or shoutout on this site is paid or affiliated"
