# Draws samyaroy's GitHub koi every night and uploads it to the media bucket
# (R2 `photo-dump`, served at media.samyabrata.codeium.xyz/koi/), where the
# Contact page loads it. Nothing is committed: the images live only in the
# bucket, so the nightly run never touches a branch or starts a deploy.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the bucket
#
# The schedule only runs from the default branch (V1). Pushing a change to
# this file runs it once from whichever branch it lands on.
#
# git-koi is built from the folio-forge-connector branch of the fork at
# samyaroy/git-koi, so a change pushed there shows in the next koi without
# touching this repo. The fork's main stays free to track the original.

name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: read

concurrency: koi

jobs:
  koi:
    # Copies of this template repo have neither the bucket nor the token.
    if: github.repository == 'samyaroy/FolioForge-vue-portfolio-website'
    runs-on: ubuntu-latest
    steps:
      # Built from source rather than through the git-koi Action: the Action
      # downloads the release binary named in its Cargo.toml, so pointing it at
      # the fork would still run the original code. No checkout is needed;
      # cargo fetches the fork and writes git-koi onto the PATH.
      - name: Build git-koi from the fork
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --locked --git https://github.com/samyaroy/git-koi --branch folio-forge-connector git-koi

      # The same two commands the Action runs. `collect` reads public activity
      # through `gh`, which the built-in token is enough for.
      - name: Collect the account snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: git-koi collect samyaroy --output "$RUNNER_TEMP/koi-snapshot.json"

      - name: Render the koi
        run: git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body white

      # The GIF swims; the PNG is the still frame shown to visitors who ask
      # for reduced motion. An hour of caching is plenty for a daily image.
      - name: Upload the koi to the media bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in koi.gif koi.png; do
            npx --yes wrangler@4.132.0 r2 object put "photo-dump/koi/$file" --remote \
              --file "koi/$file" --content-type "image/${file##*.}" \
              --cache-control "public, max-age=3600"
          done
