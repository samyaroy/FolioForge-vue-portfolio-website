# Draws samyaroy's GitHub koi every night and uploads it to the media bucket
# (R2 `photo-dump`, served at media.samyabrata.codeium.xyz/koi/), where the
# Contact page loads it. Nothing is committed: the images live only in the
# bucket, so the nightly run never touches a branch or starts a deploy.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the bucket
#
# The schedule only runs from the default branch (main). Pushing a change to
# this file runs it once from whichever branch it lands on.

name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: read

concurrency: koi

jobs:
  koi:
    # Copies of this template repo have neither the bucket nor the token.
    if: github.repository == 'samyaroy/FolioForge-vue-portfolio-website'
    runs-on: ubuntu-latest
    steps:
      # No checkout: the Action brings its own binary and writes into the
      # empty workspace. Pinned to the v1.0.2 commit, since it downloads and
      # runs a binary and a tag can be moved.
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: white
          output-dir: koi

      # The GIF swims; the PNG is the still frame shown to visitors who ask
      # for reduced motion. An hour of caching is plenty for a daily image.
      - name: Upload the koi to the media bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for file in koi.gif koi.png; do
            npx --yes wrangler@4.132.0 r2 object put "photo-dump/koi/$file" --remote \
              --file "koi/$file" --content-type "image/${file##*.}" \
              --cache-control "public, max-age=3600"
          done
