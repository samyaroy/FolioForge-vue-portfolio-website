<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/profile-icon.png" />
    <!-- Fonts load from a second origin, so the connection is opened during the
         HTML parse instead of after the stylesheet request resolves. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Title, description, canonical, Open Graph, feed link, and JSON-LD are
         stamped per route at build time by scripts/seo-build.ts. The
         title below is the dev-server fallback. -->
    <title>Samyabrata Roy - Portfolio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
