# Full institute names shown as the hover tooltip (and alt text) on every logo.
#
# Content names a logo by its bare file name (`logo: [ IITM ]`); list that name
# under `Logos` of the institute it belongs to. One institute can own several
# logo files. A logo missing here falls back to its bare name, so add new logos
# to this list as well. Lookup is case-insensitive; see logoName() in
# src/config/mediaAssets.ts.
