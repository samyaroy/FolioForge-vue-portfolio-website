# "Worth Exploring" tab, right column ("Worth Subscribing"): groups of things
# to subscribe to. Same link fields as `external` (label, url/ref,
# speciality/specility, incharge), plus:
#   cadence:       short meta text, e.g. Weekly, Journal, Conference · Annual
# Group-level options:
#   icon: an mdi-* icon shown before the heading (optional)
#   id:   ties the group to its switch under showResources.showWorthSubscribing
#         in src/config/featureFlags.ts (newsletters, research-venues,
#         seminars); keep it when renaming the group
# The column is hidden while no entry is switched on. To hide an entry, add
# `enabled: false` to it, or switch it off in the admin.
