        email: tomshane25@gmail.com
      - name: Priyam Ghosh
        email: priyam.ghose.stats@gmail.com
    time_period: Nov 2026

  - title: 'Likert and Thurstone Scales: Psychometric Methods of Attitude Measurement'
    description: A seminar on two classic ways of measuring attitudes, Likert's summated ratings and Thurstone's equal-appearing intervals, and how they compare.
    type: Course Seminar
    affiliation: Student Seminar I (STS415), MSc in Statistics, `University of Calcutta`
    tech_stack: Psychometrics, Attitude Measurement, Likert Scale, Thurstone Scale
    time_period: Sep 2026 - Jan 2027

