  - title: 'A Point of No Probability: The Savage–Dickey Paradox'
    description: Looking at the Savage–Dickey ratio, a handy shortcut for Bayes factors, and why its answer can change depending on how you condition on an event of probability zero.
    type: Literature Review Article
    tech_stack: Bayesian Inference, Bayes Factors, Probability Theory, Statistical Paradoxes
    collaborators:
