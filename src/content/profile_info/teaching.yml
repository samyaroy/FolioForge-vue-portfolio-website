      - title: "TrackTube: An Open-Source YouTube-based LMS Framework for Structured Learning, Roadmap Generation and Progress Tracking"
        description: >-
          TrackTube is a full-stack web app (React 19 + FastAPI + CockroachDB) that converts any public YouTube playlist into a structured course — pulling video metadata via the YouTube Data API v3 and enforcing sequential lesson unlocking with second-level progress tracking and an anti-cheat buffer to stop skipping ahead.
           
          It layers gamification on top (XP, levels, daily streaks), auto-generates MCQ comprehension quizzes from video transcripts using Groq Cloud AI (llama-3.1-8b-instant), and offers optional in-browser webcam proctoring via MediaPipe Face Landmarker that pauses playback if the learner looks away for 3+ seconds. Checkout the [report](https://drive.google.com/file/d/1snwSUO3xx3nqUuqR4utgu8PfhZ_6uJP0/view?usp=drive_link) for more information.
