      - title: "Noise-Aware Liver Cirrhosis Classification under Outlier-Rich Clinical Data"
        description: "This study benchmarks machine learning models for liver cirrhosis classification on the cleaned Indian Liver Patient Dataset and re-evaluates them after introducing controlled Gaussian Mixture Model-based perturbations. The comparison across clean and noisy variants reveals that ensemble tree-based methods gain substantially in minority-class detection under noise, while linear and imbalance-focused models remain largely unchanged."
