bullets:
  # Associate Software Developer, IDEAS-TIH
  - id: npcyf-lead
    ref: home/experience#ideas-tih-asd
    kind: lead
    text: "Developed core components of **National Platform for Crop Yield Forecasting (NPCYF)** as a part of the **FASAL 2.0** project, funded by the **Ministry of Agriculture & Farmers' Welfare (GoI)**, supporting nationwide agricultural data processing and forecasting workflows."
  - id: npcyf-models
    ref: home/experience#ideas-tih-asd
    text: "Integrated **TabPFN**, **Panel Regression** and **Random Forest**-based forecasting workflows, including hyperparameter tuning, into the platform's model building pipeline, improving forecast accuracy by 30% over the previous baseline"
  - id: npcyf-pipeline
    ref: home/experience#ideas-tih-asd
    text: Built a data preprocessing pipeline over datasets stored in **Apache Iceberg** tables within **MinIO data lake**
  - id: npcyf-dashboard
    ref: home/experience#ideas-tih-asd
    text: Optimized dashboard performance by combining **TanStack Query**–based frontend caching and **feature-flag** driven rollouts, reducing redundant API calls by 60% and enabling role-based feature releases at runtime

  # Student Intern, IDEAS-TIH
  - id: fasal-lead
    ref: home/experience#ideas-tih-intern
    kind: lead
    text: "Contributed to the **FASAL 2.0** project funded by the **Ministry of Agriculture & Farmers' Welfare (GoI)**, focusing on end-to-end agricultural data processing and application development:"
  - id: imd-scraping
    ref: home/experience#ideas-tih-intern
    text: Scraped and preprocessed district-wise meteorological data using **IMDLib library** to build ML-ready datasets
  - id: quarterly-reports
    ref: home/experience#ideas-tih-intern
    text: Automated quarterly report generation and integrated the workflow into production
  - id: fastapi-react
    ref: home/experience#ideas-tih-intern
    text: Built RESTful APIs using **FastAPI** and developed responsive UI using **React**, **Tailwind CSS** and **Material UI**

  # Messy Mashup
  - id: mm-cnn
    ref: projects-publications/research#messymashup
    text: Built and trained CNN classifiers using custom and pretrained backbones for music genre classification under noisy mashup conditions, achieving 87% accuracy
  - id: mm-mashups
    ref: projects-publications/research#messymashup
    text: Generated on-the-fly synthetic same-genre mashups from multi-stem audio with tempo synchronization to simulate distribution shift
  - id: mm-features
    ref: projects-publications/research#messymashup
    text: Engineered Mel-spectrogram and MFCC features with variable environmental noise augmentation to improve robustness under noise and cross-track mixing

  # Political comment classification
  - id: reddit-data
    ref: projects-publications/research#reddit-classification
    text: Analyzed Reddit comment data leveraging a publicly available dataset for large-scale political discourse analysis
  - id: reddit-pipeline
    ref: projects-publications/research#reddit-classification
    text: Built and tuned an end-to-end NLP pipeline including text preprocessing, TF-IDF feature extraction, and supervised ML models such as Logistic Regression, Random Forest, XGBoost, Multinomial Naive Bayes, and SVM, achieving 80% test accuracy with performance evaluated using precision, recall and F1-score

  # Predicting wine quality
  - id: wine-methods
    ref: projects-publications/research#wine-quality
    text: Applied linear, ridge, and robust regression to a Wine Quality dataset (n = 32), diagnosing multicollinearity using VIF and addressing outlier influence with robust estimators
  - id: wine-compare
    ref: projects-publications/research#wine-quality
    text: Compared model performance using RMSE and Adjusted R², demonstrating greater stability of robust regression

