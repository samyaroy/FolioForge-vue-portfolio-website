  - id: career-study
    ref: projects-publications/research#career-preferences
    text: "Collaboratively carried out a statistical study on career preferences among Kolkata’s college students (age group: 18–25 years) using a custom-collected dataset (n = 172 valid responses from 194 surveyed)"
  - id: career-eda
    ref: projects-publications/research#career-preferences
    text: "Performed EDA and applied non-parametric inference techniques to explore academic and socio-economic factors' influence on students' choice of career vectors (Degree, Subject)"

