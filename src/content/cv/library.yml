summaries:
  - id: profile
    text: Statistics postgraduate student with a background in data science and prior experience in software development and applied quantitative work. Interested in statistical inference, machine learning, and their applications to real-world problems. Have worked on projects involving statistical modelling, forecasting, survey analysis, NLP, and deep learning, and am looking to further develop my research and analytical skills.
    academic: M.Sc. Statistics student with experience in applied statistical modelling and machine learning. My work so far has involved both statistical and computational approaches to real-world problems, and I am now particularly interested in exploring inferential statistics more deeply and applying it to research-oriented problems.
    data: Data analyst with a background in statistics and data science, and experience in data preprocessing, exploratory analysis, predictive modelling, and reporting workflows. Worked on forecasting systems, survey-based analysis, and text classification projects across academic and applied environments. Interested in turning complex datasets into actionable insights and decision-support tools.
    fullstack: Quantitative developer with experience in statistical modelling, machine learning, full-stack web application development, and production-oriented ML pipelines. Built forecasting workflows, analytical APIs, scalable data processing systems, and real-world machine learning solutions in applied research environments. Focused on translating quantitative methods into usable products and decision-support systems.
    ml: Applied machine learning developer with experience in statistical modelling, machine learning, and production-oriented data workflows. Built forecasting pipelines, analytical APIs, and real-world ML solutions across applied research environments, with work spanning time-series forecasting, NLP, and deep learning. Interested in developing robust, scalable machine learning systems for real-world decision support.
    research-ml: Statistics graduate and data science student with experience in machine learning, statistical modelling, and applied research projects across academic and interdisciplinary settings. Worked on data preprocessing, predictive modelling, and experimental analysis in forecasting, NLP, and deep learning tasks, with interest in statistical learning and research involving complex real-world datasets.
    stats: Statistics graduate with experience in statistical modelling, quantitative analysis, and applied research projects across academic and interdisciplinary settings. Worked on data preprocessing, regression, non-parametric inference, and predictive modelling, with interest in statistical learning and research involving complex real-world datasets.

