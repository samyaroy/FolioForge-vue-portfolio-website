# The CVs built from library.yml and the portfolio.
#
# A preset lists what it shows, in order: nothing joins it until it is added
# here or ticked in the builder. `prefer` names the variant keys whose wording
# it prints; `template_options` are the template's own settings. See
# admin/docs/cv_architecture.md §5.3.

presets:
  - id: consolidated
    name: Consolidated CV
    filename: SamyabrataRoy_Resume_Consolidated
    template: resume-v1
    pages: 2
    header: [ phone, gmail, website, linkedin, github ]
    sections:
      - kind: summary
        items: [ profile ]
      - kind: experience
        items:
          - ref: home/experience#ideas-tih-asd
            bullets: [ npcyf-lead, npcyf-models, npcyf-pipeline, npcyf-dashboard ]
      - kind: education
        items: [ home/education#msc-cu, home/education#bs-iitm, home/education#bsc-snu ]
      - kind: projects
        title: Selected Projects
        items:
          - ref: projects-publications/research#messymashup
            bullets: [ mm-cnn, mm-mashups, mm-features ]
          - ref: projects-publications/research#reddit-classification
            bullets: [ reddit-data, reddit-pipeline ]
          - ref: projects-publications/research#wine-quality
            bullets: [ wine-methods, wine-compare ]
          - ref: projects-publications/research#career-preferences
            bullets: [ career-study, career-eda ]
          - ref: projects-publications/minor#quiz-pilot
            style: compact
          - ref: projects-publications/technical#doctor-vaahaan
            style: compact
      - kind: skills
        items: [ languages, web-development, statistics-ml, databases, others ]
      - kind: positions
        items:
          - ref: ideas-mentor
            bullets: [ mentor-interns ]
          - ref: chi-square
            bullets: [ chi-founded, chi-events ]
      - kind: interests
        items: [ nonparametric, bayesian, ml, dl, uq ]

